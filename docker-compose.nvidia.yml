services:
  tater-oww-server:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    image: tater-oww-server:nvidia
    container_name: tater-oww-server
    restart: unless-stopped
    gpus: all
    ports:
      - "8502:8502"
    environment:
      TATER_OWW_MODEL: hey_jarvis
      TATER_OWW_FRAMEWORK: onnx
      TATER_OWW_DEVICE: gpu
      TATER_OWW_THRESHOLD: "0.95"
      TATER_OWW_PATIENCE: "2"
      TATER_OWW_DEBOUNCE_S: "4.0"
      TATER_OWW_LOG_LEVEL: info
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/models
